<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Openframe — visual website builder, open code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/editor.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="M4 9h10a5 5 0 0 1 0 10H8" />
        <path d="M8 5L4 9l4 4" />
      </symbol>
      <symbol id="i-redo" viewBox="0 0 24 24">
        <path d="M20 9H10a5 5 0 0 0 0 10h6" />
        <path d="M16 5l4 4-4 4" />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="13" rx="2" />
        <path d="M8 21h8M12 17v4" />
      </symbol>
      <symbol id="i-tablet" viewBox="0 0 24 24">
        <rect x="6" y="2" width="12" height="20" rx="2" />
        <path d="M11 18h2" />
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <rect x="8" y="2" width="8" height="20" rx="2" />
        <path d="M11 18h2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24">
        <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="M16.5 16.5L21 21" />
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="M12 3l9 5-9 5-9-5 9-5z" />
        <path d="M3 13l9 5 9-5" />
      </symbol>
      <symbol id="i-pages" viewBox="0 0 24 24">
        <path d="M7 3h7l4 4v14H7z" />
        <path d="M14 3v4h4" />
      </symbol>
      <symbol id="i-theme" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <circle cx="9" cy="9" r="1.2" />
        <circle cx="15" cy="9" r="1.2" />
        <circle cx="9" cy="15" r="1.2" />
      </symbol>
      <symbol id="i-add" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M12 8v8M8 12h8" />
      </symbol>
      <symbol id="i-preview" viewBox="0 0 24 24">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6" />
        <path d="M20 4L10 14" />
        <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <path d="M5 15V5a1 1 0 0 1 1-1h9" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v10" />
        <path d="M8 11l4 4 4-4" />
        <path d="M4 19h16" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" />
      </symbol>
      <symbol id="i-duplicate" viewBox="0 0 24 24">
        <rect x="8" y="8" width="11" height="11" rx="2" />
        <path d="M5 15V5a1 1 0 0 1 1-1h9" />
        <path d="M13 11v5M10.5 13.5h5" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M9 7V5h6v2" />
        <path d="M6 7l1 13h10l1-13" />
        <path d="M10 11v5M14 11v5" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M4 4l16 16" />
        <path
          d="M9.5 5.4A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.6"
        />
        <path d="M6.2 7.2C3.7 9 2 12 2 12s3.5 6 10 6a10 10 0 0 0 3.5-.6" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 7.5-2" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="M9 7l-5 5 5 5" />
        <path d="M15 7l5 5-5 5" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="9" cy="10" r="1.6" />
        <path d="M4 18l5-5 4 4 3-3 4 4" />
      </symbol>
      <symbol id="i-text" viewBox="0 0 24 24">
        <path d="M4 6h16M4 11h16M4 16h10M4 20h7" />
      </symbol>
      <symbol id="i-heading" viewBox="0 0 24 24">
        <path d="M6 5v14M18 5v14M6 12h12" />
      </symbol>
      <symbol id="i-button" viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="8" rx="4" />
        <path d="M9 12h6" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1.5 1.5" />
        <path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.5-1.5" />
      </symbol>
      <symbol id="i-divider" viewBox="0 0 24 24">
        <path d="M4 12h16" />
        <path d="M8 6h8M8 18h8" opacity=".35" />
      </symbol>
      <symbol id="i-spacer" viewBox="0 0 24 24">
        <path d="M12 3v7M12 21v-7" />
        <path d="M9 6l3-3 3 3M9 18l3 3 3-3" />
        <path d="M4 12h16" opacity=".35" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path
          d="M12 3l2.6 5.6L21 9.3l-4.6 4.3L17.5 20 12 16.8 6.5 20l1.1-6.4L3 9.3l6.4-.7z"
        />
      </symbol>
      <symbol id="i-section" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 9h18" />
      </symbol>
      <symbol id="i-container" viewBox="0 0 24 24">
        <rect x="4" y="5" width="16" height="14" rx="2" />
        <path d="M8 9h8M8 13h5" opacity=".5" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="8" height="8" rx="1.5" />
        <rect x="13" y="3" width="8" height="8" rx="1.5" />
        <rect x="3" y="13" width="8" height="8" rx="1.5" />
        <rect x="13" y="13" width="8" height="8" rx="1.5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7" />
      </symbol>
      <symbol id="i-warning" viewBox="0 0 24 24">
        <path d="M12 3l9 17H3z" />
        <path d="M12 9v5M12 17h.01" />
      </symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24">
        <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" />
        <path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z" />
      </symbol>
      <symbol id="i-form" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M7 8h10M7 12h10M7 16h5" />
      </symbol>
      <symbol id="i-input" viewBox="0 0 24 24">
        <rect x="2" y="8" width="20" height="8" rx="2" />
        <path d="M6 10v4" />
      </symbol>
      <symbol id="i-textarea" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M7 9h10M7 13h10M7 17h4" />
      </symbol>
      <symbol id="i-select" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="10" rx="2" />
        <path d="M8 11h6" />
        <path d="M13 13l2 2 2-2" />
      </symbol>
      <symbol id="i-radio" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="2.5" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M9 6h11M9 12h11M9 18h11" />
        <path d="M4 6h.01M4 12h.01M4 18h.01" />
      </symbol>
      <symbol id="i-table" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 10h18M3 15h18M9 4v16" />
      </symbol>
      <symbol id="i-video" viewBox="0 0 24 24">
        <rect x="3" y="5" width="13" height="14" rx="2" />
        <path d="M16 10l5-3v10l-5-3z" />
      </symbol>
      <symbol id="i-audio" viewBox="0 0 24 24">
        <path d="M9 18V6l10-2v12" />
        <circle cx="6.5" cy="18" r="2.5" />
        <circle cx="16.5" cy="16" r="2.5" />
      </symbol>
      <symbol id="i-details" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M8 11h8" />
        <path d="M13 8l3 3-3 3" />
      </symbol>
      <symbol id="i-quote" viewBox="0 0 24 24">
        <path d="M10 6c-3 1-4 3.5-4 6.5V18h6v-6H8c0-2 .5-3.5 2-4.5z" />
        <path d="M20 6c-3 1-4 3.5-4 6.5V18h6v-6h-4c0-2 .5-3.5 2-4.5z" />
      </symbol>
      <symbol id="i-label" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="12" rx="2" />
        <path d="M7 12h4" />
      </symbol>
      <symbol id="i-progress" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <path d="M12 12l4-3" />
      </symbol>
      <symbol id="i-toggle" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="10" rx="5" />
        <circle cx="8" cy="12" r="3" />
      </symbol>
    </svg>

    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <rect x="2" y="2" width="28" height="28" rx="8" fill="#4f46e5" />
              <path
                d="M10 21V11h6.5a4 4 0 0 1 0 8H10"
                stroke="#fff"
                stroke-width="2.4"
                fill="none"
                stroke-linecap="round"
              />
              <path
                d="M10 15h5"
                stroke="#fff"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="brand-name">Openframe</span>
          <span class="brand-tag">visual → code</span>
        </div>

        <div class="doc">
          <input
            id="docName"
            class="doc-name"
            type="text"
            value="Untitled site"
            aria-label="Site name"
            spellcheck="false"
          />
          <button class="btn btn-ghost btn-small" id="fileBtn" type="button">
            File
          </button>
        </div>

        <div class="topbar-center">
          <div class="btn-group">
            <button
              class="icon-btn"
              id="undoBtn"
              type="button"
              title="Undo (Ctrl+Z)"
              aria-label="Undo"
            >
              <svg class="icon"><use href="#i-undo" /></svg>
            </button>
            <button
              class="icon-btn"
              id="redoBtn"
              type="button"
              title="Redo (Ctrl+Shift+Z)"
              aria-label="Redo"
            >
              <svg class="icon"><use href="#i-redo" /></svg>
            </button>
          </div>
          <span class="topbar-sep"></span>
          <div
            class="device-switch"
            id="deviceSwitch"
            role="group"
            aria-label="Breakpoint"
          >
            <button
              class="device-btn is-active"
              data-bp="desktop"
              type="button"
              title="Desktop"
            >
              <svg class="icon"><use href="#i-monitor" /></svg
              ><span>Desktop</span>
            </button>
            <button
              class="device-btn"
              data-bp="tablet"
              type="button"
              title="Tablet ≤900px"
            >
              <svg class="icon"><use href="#i-tablet" /></svg
              ><span>Tablet</span>
            </button>
            <button
              class="device-btn"
              data-bp="mobile"
              type="button"
              title="Mobile ≤600px"
            >
              <svg class="icon"><use href="#i-phone" /></svg><span>Mobile</span>
            </button>
          </div>
        </div>

        <div class="topbar-right">
          <span class="save-state" id="saveState">Saved</span>
          <button class="btn btn-ghost" id="previewBtn" type="button">
            <svg class="icon"><use href="#i-preview" /></svg
            ><span>Preview</span>
          </button>
          <button class="btn btn-primary" id="exportBtn" type="button">
            <svg class="icon"><use href="#i-code" /></svg
            ><span>Export code</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <nav class="side-tabs" role="tablist">
            <button
              class="side-tab is-active"
              data-tab="add"
              type="button"
              role="tab"
            >
              <svg class="icon"><use href="#i-add" /></svg><span>Add</span>
            </button>
            <button class="side-tab" data-tab="layers" type="button" role="tab">
              <svg class="icon"><use href="#i-layers" /></svg
              ><span>Layers</span>
            </button>
            <button class="side-tab" data-tab="pages" type="button" role="tab">
              <svg class="icon"><use href="#i-pages" /></svg><span>Pages</span>
            </button>
            <button class="side-tab" data-tab="theme" type="button" role="tab">
              <svg class="icon"><use href="#i-theme" /></svg><span>Theme</span>
            </button>
          </nav>
          <div class="side-body">
            <div class="panel is-active" data-panel="add" id="panelAdd"></div>
            <div class="panel" data-panel="layers" id="panelLayers"></div>
            <div class="panel" data-panel="pages" id="panelPages"></div>
            <div class="panel" data-panel="theme" id="panelTheme"></div>
          </div>
          <div class="side-foot">
            <span class="dot"></span>
            <span>Autosaves locally</span>
          </div>
        </aside>

        <section class="stage">
          <div class="stage-bar">
            <div class="stage-left">
              <span class="stage-crumb" id="stageCrumb">Home</span>
              <span class="stage-bp" id="stageBp">Desktop · 1280px</span>
            </div>
            <div class="zoom">
              <button
                class="icon-btn"
                id="zoomOut"
                type="button"
                title="Zoom out"
                aria-label="Zoom out"
              >
                <svg class="icon"><use href="#i-minus" /></svg>
              </button>
              <button
                class="zoom-value"
                id="zoomValue"
                type="button"
                title="Zoom to fit"
              >
                100%
              </button>
              <button
                class="icon-btn"
                id="zoomIn"
                type="button"
                title="Zoom in"
                aria-label="Zoom in"
              >
                <svg class="icon"><use href="#i-plus" /></svg>
              </button>
              <button
                class="icon-btn"
                id="zoomFit"
                type="button"
                title="Fit to window"
                aria-label="Fit to window"
              >
                <svg class="icon"><use href="#i-fit" /></svg>
              </button>
            </div>
          </div>

          <div class="viewport" id="viewport">
            <div class="canvas-outer" id="canvasOuter">
              <div class="canvas" id="canvas">
                <div class="page" id="pageRoot"></div>
                <div class="empty-state" id="emptyState" hidden>
                  <div class="empty-icon">
                    <svg class="icon"><use href="#i-sparkle" /></svg>
                  </div>
                  <h2>Start with a block</h2>
                  <p>
                    Drag a section from the Add panel, or click one to drop it
                    here.
                  </p>
                </div>
                <div class="overlay" id="overlay"></div>
                <div class="drop-line" id="dropLine" hidden></div>
              </div>
            </div>
          </div>

          <div class="stage-foot">
            <span class="kbd-hint"><kbd>Double-click</kbd> text to edit</span>
            <span class="kbd-hint"><kbd>Del</kbd> remove</span>
            <span class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
            <span class="stage-foot-right" id="stagePages"></span>
          </div>
        </section>

        <aside class="inspector" id="inspector"></aside>
      </main>
    </div>

    <div class="menu" id="fileMenu" hidden></div>
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden />

    <script src="assets/js/util.js"></script>
    <script src="assets/js/schema.js"></script>
    <script src="assets/js/model.js"></script>
    <script src="assets/js/blocks.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/inspector.js"></script>
    <script src="assets/js/zip.js"></script>
    <script src="assets/js/exporter.js"></script>
    <script src="assets/js/dnd.js"></script>
    <script src="assets/js/panels.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
